<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claims Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Claims Board</h1>
    </header>
    
    <main>
        <div class="board">
            <div class="column" data-stage="received">
                <h2>Received</h2>
                <div class="cards">
                    <p class="empty-message">No claims</p>
                </div>
            </div>
            
            <div class="column" data-stage="being-assessed">
                <h2>Being Assessed</h2>
                <div class="cards">
                    <p class="empty-message">No claims</p>
                </div>
            </div>
            
            <div class="column" data-stage="approved">
                <h2>Approved</h2>
                <div class="cards">
                    <p class="empty-message">No claims</p>
                </div>
            </div>
            
            <div class="column" data-stage="rejected">
                <h2>Rejected</h2>
                <div class="cards">
                    <p class="empty-message">No claims</p>
                </div>
            </div>
            
            <div class="column" data-stage="paid">
                <h2>Paid</h2>
                <div class="cards">
                    <p class="empty-message">No claims</p>
                </div>
            </div>
        </div>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
